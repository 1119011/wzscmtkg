<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>幸存者 - 志怪论坛</title>
  <link rel="stylesheet" href="css/style.css?v=20261108a">
  <link rel="stylesheet" href="css/admin.css?v=20261106d">
  <link rel="stylesheet" href="css/features.css">
  <link rel="stylesheet" href="css/social.css?v=20261108b">
  <link rel="stylesheet" href="css/tweaks.css">
  <link rel="stylesheet" href="css/profile.css?v=20261104b">
  <link rel="stylesheet" href="css/communication.css?v=20261105c">
  <link rel="stylesheet" href="css/map.css?v=20261108f">
  <link rel="stylesheet" href="css/dark.css?v=20261108a">
  <script>
    (function () {
      try {
        if (localStorage.getItem('survivorDarkMode') === '1') {
          document.documentElement.classList.add('dark-mode');
        }
      } catch (e) {}
    })();
  </script>
</head>
<body>

  <!-- ========== 顶部导航栏 ========== -->
  <nav class="navbar">
    <div class="navbar-logo">幸存者</div>
    
    <div class="navbar-search">
      <input type="text" placeholder="搜索你感兴趣的内容...">
    </div>

    <div class="navbar-nav">
      <button id="nav-home" class="active">首页</button>
      <button id="nav-hot">热门</button>
      <button id="nav-follow">关注</button>
    </div>

    <div class="navbar-user">
      <button class="dark-toggle" id="dark-toggle" type="button" title="夜间模式" aria-label="夜间模式" aria-pressed="false">☾</button>
      <!-- 未登录状态 -->
      <div id="guest-area" style="display: flex; gap: 8px;">
        <button class="btn-secondary" id="btn-login">登录</button>
        <button class="btn-primary" id="btn-register">注册</button>
      </div>

      <!-- 已登录状态 -->
      <div id="user-area" style="display: none; gap: 12px; align-items: center;">
        <button class="btn-primary" id="btn-create-post">✏️ 发帖子</button>
        <div class="user-info">
          <div class="user-avatar">U</div>
          <span class="user-name">用户</span>
        </div>
        <button class="btn-secondary" id="btn-logout" style="padding: 6px 12px;">登出</button>
      </div>
    </div>
  </nav>

  <!-- ========== 主容器 ========== -->
  <div class="main-container">
    
    <!-- 左侧边栏 -->
    <aside class="sidebar-left">
      <ul class="sidebar-menu">
        <li data-view="home" class="active">
          <span class="icon">⌂</span> 首页推荐
        </li>
        <li data-view="hot">
          <span class="icon">♨</span> 热门话题
        </li>
        <li data-view="follow">
          <span class="icon">★</span> 我的关注
        </li>
        <li data-view="profile">
          <span class="icon">☺</span> 个人主页
        </li>
        <li data-view="map">
          <span class="icon">⌖</span> 异闻定位
        </li>
      </ul>
    </aside>

    <!-- 中间内容区 -->
    <main id="content-area" class="content-area">
      <div id="post-list-container">
        <!-- 帖子列表将通过 JS 渲染 -->
      </div>
    </main>

    <!-- 右侧边栏 -->
    <aside class="sidebar-right">
      <div id="sidebar-right">
        <!-- 右侧内容将通过 JS 渲染 -->
      </div>
    </aside>

  </div>

  <!-- ========== 脚本引入 ========== -->
  <script src="js/supabase-config.js?v=20261111a"></script>
  <script src="js/supabase-client.js?v=20261110a"></script>
  <script src="js/storage.js?v=20261111b"></script>
  <script src="js/auth.js?v=20261110a"></script>
  <script src="js/manage.js?v=20261108a"></script>
  <script src="js/posts.js?v=20261108a"></script>
  <script src="js/app.js?v=20261110a"></script>
  <script src="js/retro.js"></script>
  <script src="js/admin.js?v=20261108a"></script>
  <script src="js/features.js?v=20261108a"></script>
  <script src="js/social.js?v=20261110g"></script>
  <script src="js/tweaks.js?v=20261108a"></script>
  <script src="js/lofter-seed.js?v=20261108a"></script>
  <script src="js/lofter-seed2.js?v=20261108a"></script>
  <script src="js/tag-patch.js?v=20261108a"></script>
  <script src="js/lofter-seed3.js?v=20261108a"></script>
  <script src="js/lofter-seed4.js?v=20261108a"></script>
  <script src="js/lofter-seed5.js?v=20261108a"></script>
  <script src="js/lofter-seed6.js?v=20261108a"></script>
  <script src="js/lofter-seed8.js?v=20261108a"></script>
  <script src="js/restore-posts.js?v=20261108a"></script>
  <script src="js/delete-comment-3l.js?v=20261108a"></script>
  <script src="js/delete-comment-4l.js?v=20261108a"></script>
  <script src="js/patch-darknet-animation-comments.js?v=20261108a"></script>
  <script src="js/rename-record-post.js?v=20261108a"></script>
  <script src="js/profile.js?v=20261106"></script>
  <script src="js/original-poster-comment-patch.js?v=20261108a"></script>
  <script src="js/dark-mode.js?v=20261104"></script>
  <script src="js/communication.js?v=20261106"></script>
  <script src="js/lofter-group-seed7.js?v=20261105b"></script>
  <script src="js/lofter-group-seed8.js?v=20261105"></script>
  <script src="js/group-rename-chat.js?v=20261105"></script>
  <script src="js/group-chat-link.js?v=20261105"></script>
  <script src="js/map-users-seed.js?v=20261108a"></script>
  <script src="js/map-view.js?v=20261108h"></script>
  <script src="js/patch-darknet-comment-121.js?v=20261108a"></script>

</body>
</html>
