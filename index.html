<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>幸存者 - 志怪论坛</title>
  <link rel="stylesheet" href="css/style.css?v=20261108a">
  <link rel="stylesheet" href="css/admin.css?v=20261106d">
  <link rel="stylesheet" href="css/features.css">
  <link rel="stylesheet" href="css/social.css?v=20261108b">
  <link rel="stylesheet" href="css/tweaks.css">
  <link rel="stylesheet" href="css/profile.css?v=20261104b">
  <link rel="stylesheet" href="css/communication.css?v=20261105c">
  <link rel="stylesheet" href="css/map.css?v=20261108f">
  <link rel="stylesheet" href="css/dark.css?v=20261108a">
  <script>
    (function () {
      try {
        if (localStorage.getItem('survivorDarkMode') === '1') {
          document.documentElement.classList.add('dark-mode');
        }
      } catch (e) {}
    })();
  </script>
  <style>
    /* 首屏加载骨架：数据到达前占位，避免误认为是空站 */
    .post-skeleton {
      background: #FFFDF6;
      border: 1px solid #E4D8C4;
      border-radius: 2px;
      padding: 16px 22px;
      margin-bottom: 10px;
    }
    .post-skeleton .sk-line {
      height: 12px;
      border-radius: 2px;
      background: linear-gradient(90deg, #EFE6D6 25%, #F7F1E6 50%, #EFE6D6 75%);
      background-size: 200% 100%;
      animation: sk-shimmer 1.4s ease-in-out infinite;
      margin-bottom: 10px;
    }
    .post-skeleton .sk-line.sk-title { height: 16px; width: 62%; }
    .post-skeleton .sk-line.sk-short { width: 34%; margin-bottom: 0; }
    .post-skeleton .sk-meta {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }
    .post-skeleton .sk-avatar {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #EFE6D6;
    }
    .post-skeleton .sk-meta .sk-line { margin-bottom: 0; width: 88px; height: 10px; }
    .post-skeleton-hint {
      text-align: center;
      font-size: 12px;
      letter-spacing: 2px;
      color: #A89680;
      padding: 4px 0 14px;
    }
    @keyframes sk-shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }
    }
    .dark-mode .post-skeleton { background: #23252b; border-color: #34373f; }
    .dark-mode .post-skeleton .sk-line { background: linear-gradient(90deg, #34373f 25%, #3d414a 50%, #34373f 75%); background-size: 200% 100%; }
    .dark-mode .post-skeleton .sk-avatar { background: #34373f; }
    .dark-mode .post-skeleton-hint { color: #7c8494; }
  </style>
</head>
<body>

  <!-- ========== 顶部导航栏 ========== -->
  <nav class="navbar">
    <div class="navbar-logo">幸存者</div>
    
    <div class="navbar-search">
      <input type="text" placeholder="搜索你感兴趣的内容...">
    </div>

    <div class="navbar-nav">
      <button id="nav-home" class="active">首页</button>
      <button id="nav-hot">热门</button>
      <button id="nav-follow">关注</button>
    </div>

    <div class="navbar-user">
      <button class="dark-toggle" id="dark-toggle" type="button" title="夜间模式" aria-label="夜间模式" aria-pressed="false">☾</button>
      <!-- 未登录状态 -->
      <div id="guest-area" style="display: flex; gap: 8px;">
        <button class="btn-secondary" id="btn-login">登录</button>
        <button class="btn-primary" id="btn-register">注册</button>
      </div>

      <!-- 已登录状态 -->
      <div id="user-area" style="display: none; gap: 12px; align-items: center;">
        <button class="btn-primary" id="btn-create-post">✏️ 发帖子</button>
        <div class="user-info">
          <div class="user-avatar">U</div>
          <span class="user-name">用户</span>
        </div>
        <button class="btn-secondary" id="btn-logout" style="padding: 6px 12px;">登出</button>
      </div>
    </div>
  </nav>

  <!-- ========== 主容器 ========== -->
  <div class="main-container">
    
    <!-- 左侧边栏 -->
    <aside class="sidebar-left">
      <ul class="sidebar-menu">
        <li data-view="home" class="active">
          <span class="icon">⌂</span> 首页推荐
        </li>
        <li data-view="hot">
          <span class="icon">♨</span> 热门话题
        </li>
        <li data-view="follow">
          <span class="icon">★</span> 我的关注
        </li>
        <li data-view="profile">
          <span class="icon">☺</span> 个人主页
        </li>
        <li data-view="map">
          <span class="icon">⌖</span> 异闻定位
        </li>
      </ul>
    </aside>

    <!-- 中间内容区 -->
    <main id="content-area" class="content-area">
      <div id="post-list-container">
        <div class="post-skeleton-hint">正在加载…</div>
        <div class="post-skeleton">
          <div class="sk-meta"><div class="sk-avatar"></div><div class="sk-line"></div></div>
          <div class="sk-line sk-title"></div>
          <div class="sk-line"></div>
          <div class="sk-line sk-short"></div>
        </div>
        <div class="post-skeleton">
          <div class="sk-meta"><div class="sk-avatar"></div><div class="sk-line"></div></div>
          <div class="sk-line sk-title"></div>
          <div class="sk-line"></div>
          <div class="sk-line sk-short"></div>
        </div>
        <div class="post-skeleton">
          <div class="sk-meta"><div class="sk-avatar"></div><div class="sk-line"></div></div>
          <div class="sk-line sk-title"></div>
          <div class="sk-line"></div>
          <div class="sk-line sk-short"></div>
        </div>
      </div>
    </main>

    <!-- 右侧边栏 -->
    <aside class="sidebar-right">
      <div id="sidebar-right">
        <!-- 右侧内容将通过 JS 渲染 -->
      </div>
    </aside>

  </div>

  <!-- ========== 脚本引入 ========== -->
  <script src="js/supabase-config.js?v=20261111a"></script>

  <script src="js/admin.js?v=20261108a"></script>
  <script src="js/features.js?v=20261108a"></script>
  <script src="js/social.js?v=20261111a"></script>
  <script src="js/tweaks.js?v=20261108a"></script>

</body>
